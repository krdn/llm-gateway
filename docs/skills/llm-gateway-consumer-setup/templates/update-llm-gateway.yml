name: Update @krdn/llm-gateway

on:
  repository_dispatch:
    types: [llm-gateway-release]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-llm-gateway
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '{{NODE_VERSION}}'
      - name: Update @krdn/llm-gateway
        run: |
          {{UPDATE_COMMANDS}}
      - name: Create or refresh the dependency PR
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            {{PR_PATHS}}
          branch: chore/update-llm-gateway
          delete-branch: true
          title: 'chore(deps): update @krdn/llm-gateway'
          commit-message: 'chore(deps): update @krdn/llm-gateway'
          labels: dependencies
          body: '소비자 프로젝트가 허용한 버전 범위에서 @krdn/llm-gateway를 갱신합니다.'
