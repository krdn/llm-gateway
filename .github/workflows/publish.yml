name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance 증명 (publishConfig.provenance)
    steps:
      # NPM_TOKEN을 다루는 잡이므로 전 액션 SHA 고정 (supply-chain 보안)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # pnpm 버전은 package.json의 packageManager 필드에서 읽는다 (단일 출처)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 소비자 알림은 publish 성공 이후에만 발송한다
  # (publish 실패/진행 중 상태에서 소비자가 업데이트를 시도하는 레이스 방지)
  notify:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      # 한 소비자 dispatch 실패(PAT 스코프 등)가 다른 소비자 알림까지 취소하지 않도록
      fail-fast: false
      matrix:
        repo:
          # ai-signalcraft는 dispatch 미등록 — CONSUMER_DISPATCH_PAT가 접근 불가했고
          # 수신 워크플로도 구 계약이라 영구 미발화였음. npm range(^x)로 전환돼
          # Dependabot(daily)이 업데이트 PR을 생성하는 단일 경로로 일원화.
          - krdn/gons-dashboard
    steps:
      - name: Dispatch release event to ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.CONSUMER_DISPATCH_PAT }}
          repository: ${{ matrix.repo }}
          event-type: llm-gateway-release
          client-payload: '{"tag": "${{ github.event.release.tag_name }}"}'
