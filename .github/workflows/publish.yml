name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance 증명 (publishConfig.provenance)
    steps:
      # NPM_TOKEN을 다루는 잡이므로 전 액션 SHA 고정 (supply-chain 보안)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm 버전은 package.json의 packageManager 필드에서 읽는다 (단일 출처)
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 소비자 알림은 publish 성공 이후에만 발송한다
  # (publish 실패/진행 중 상태에서 소비자가 업데이트를 시도하는 레이스 방지)
  notify:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      # 한 소비자 dispatch 실패(PAT 스코프 등)가 다른 소비자 알림까지 취소하지 않도록
      fail-fast: false
      matrix:
        repo:
          - krdn/gons-dashboard
          # ai-signalcraft 수신측은 update-llm-gateway.yml(llm-gateway-release 계약)로
          # 복원됨. CONSUMER_DISPATCH_PAT 재발급 전까지 이 dispatch는 실패하지만
          # fail-fast:false라 다른 소비자에 영향 없고, 수신측 daily cron이 백업 경로.
          - krdn/ai-signalcraft
    steps:
      - name: Dispatch release event to ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.CONSUMER_DISPATCH_PAT }}
          repository: ${{ matrix.repo }}
          event-type: llm-gateway-release
          client-payload: '{"tag": "${{ github.event.release.tag_name }}"}'
