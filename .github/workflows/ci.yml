name: CI

on:
  push:
    branches: [main]
    # dist-freshness 잡이 태그에서만 돌기 위해 필요하다 (아래 주석 참조)
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # engines가 광고하는 하한(22)과 소비자가 실제로 쓰는 버전(24)에서 각각 돈다.
  # 이전에는 Node 20 하나였는데, 20은 2026-04-30에 EOL이라 지원되지 않는
  # 런타임에서만 검증하고 있었다.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 package.json의 packageManager 필드에서 읽는다 (단일 출처)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm build

  # peerDependencies가 zod 3·4를 모두 광고하므로 zod 4 설치 그래프도 실제로 검증한다.
  # lockfile은 zod 3을 고정하고 있어 위 test 잡만으로는 zod 4 경로가 한 번도 돌지 않는다.
  zod4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 이 잡에서만 zod를 4.x로 교체한다. `pnpm add`는 lockfile을 갱신하지만
      # 러너 한정이라 저장소에 반영되지 않는다 (--frozen-lockfile은 install 전용 옵션).
      - run: pnpm add -D zod@^4.1.8
      # 메이저를 hard-fail로 강제한다. 회귀 테스트는 `zod/v3`·`zod/v4` 서브패스를 쓰는데
      # 그 서브패스가 두 메이저 모두에 있어서, 루트 zod가 3.x에 머물러도 테스트는 통과한다.
      # 즉 이 확인이 없으면 잡이 초록이어도 zod 4 설치 그래프를 검증했다는 보장이 없다.
      # `ai`가 해석하는 zod까지 함께 보는 이유: 우리 타입은 `ai`의 FlexibleSchema를 경유한다.
      - name: zod 4 설치 그래프 확인 (hard assert)
        run: |
          node -e '
            const req = (p) => require(p).version;
            const checks = {
              root: req("zod/package.json"),
              viaAi: req(require.resolve("zod/package.json", { paths: [require.resolve("ai")] })),
            };
            console.log(checks);
            for (const [k, v] of Object.entries(checks)) {
              if (!v.startsWith("4.")) {
                console.error(`zod 4가 아니다 (${k}=${v}) — 이 잡의 목적이 무효다`);
                process.exit(1);
              }
            }
          '
      - run: pnpm typecheck
      - run: pnpm test

  # 커밋된 dist가 소스와 어긋나지 않았는지 태그 시점에 확인한다.
  #
  # 이 저장소는 dist를 릴리스마다 커밋한다 (.gitignore 주석: "Git URL 설치 패턴").
  # 실제로 소비자 하나가 `github:krdn/llm-gateway#vX.Y.Z`로 설치하므로, 그 소비자가
  # 받는 코드는 **태그에 커밋된 dist 그 자체**다. npm 경로는 prepack이 빌드해 항상
  # 최신이지만 이 경로엔 방어가 없어, 릴리스 때 빌드를 잊으면 조용히 낡는다 —
  # 4.1.0~4.1.1 구간에서 실제로 그랬다(수정이 dist에 반영되지 않은 채 태그됨).
  #
  # main push마다 강제하지 않고 태그에서만 도는 이유: 매 커밋 검증은 "릴리스 시
  # 커밋"이라는 기존 관례를 "항상 커밋"으로 바꿔버린다. 여기서 막고 싶은 것은
  # 릴리스 산출물의 불일치 하나다.
  #
  # 재빌드-후-diff가 성립하는 전제(실측): tsup 출력이 결정적이고, sourcemap의
  # sources가 상대경로(`../../src/...`)라 러너와 로컬이 바이트 동일하게 나온다.
  dist-freshness:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: 커밋된 dist가 소스와 동기인지 확인
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::커밋된 dist가 현재 소스와 다르다 — 태그 전에 'pnpm build' 후 dist를 커밋할 것. Git URL로 설치하는 소비자가 낡은 코드를 받는다."
            git diff --stat -- dist
            exit 1
          fi
          echo "dist가 소스와 동기 상태다."
