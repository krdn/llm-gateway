name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 package.json의 packageManager 필드에서 읽는다 (단일 출처)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm build

  # peerDependencies가 zod 3·4를 모두 광고하므로 zod 4 설치 그래프도 실제로 검증한다.
  # lockfile은 zod 3을 고정하고 있어 위 test 잡만으로는 zod 4 경로가 한 번도 돌지 않는다.
  zod4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 이 잡에서만 zod를 4.x로 교체한다. `pnpm add`는 lockfile을 갱신하지만
      # 러너 한정이라 저장소에 반영되지 않는다 (--frozen-lockfile은 install 전용 옵션).
      - run: pnpm add -D zod@^4.1.8
      - run: node -e "console.log('zod', require('zod/package.json').version)"
      - run: pnpm typecheck
      - run: pnpm test
