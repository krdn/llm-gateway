version: 2

updates:
  # GitHub Actions — 액션 런타임 deprecation(예: Node 20 → 24)으로 CI에 경고가
  # 쌓이기 전에 갱신한다. publish.yml의 SHA 핀도 `# vX.Y.Z` 주석을 근거로 함께
  # 올라가므로 supply-chain 고정을 유지한 채 최신화된다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # npm — AI SDK 계열은 릴리스가 잦아 한 그룹으로 묶어 PR 수를 억제한다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # zod는 peerDependency(^3.24.0)와 devDependency에 동시 선언돼 있어, dev 쪽만
      # 올리려 해도 peer 범위가 함께 바뀐다. peer 상승은 소비자에게 zod 업그레이드를
      # 강제하는 계약 변경이고, v4는 소스 수정까지 요구한다(ZodTypeDef 제거 — PR #6
      # typecheck 실패로 실증). 메이저는 사람이 릴리스 계획과 함께 결정한다.
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      # AI SDK 계열은 소비자에게 나가는 런타임 dependency인데, 테스트가 전부
      # mock 기반(vi.mock('ai') 등)이라 CI 초록이 SDK 호환성을 증명하지 못한다.
      # PR #5(ai v6→v7, 프로바이더 v3→v4)가 통과한 것이 그 예다. 메이저는
      # 마이그레이션 가이드를 보고 사람이 옮긴다. minor·patch는 자동화 유지.
      - dependency-name: ai
        update-types: ['version-update:semver-major']
      - dependency-name: '@ai-sdk/*'
        update-types: ['version-update:semver-major']
      - dependency-name: ai-sdk-provider-*
        update-types: ['version-update:semver-major']
    groups:
      ai-sdk:
        patterns:
          - ai
          - '@ai-sdk/*'
          - ai-sdk-provider-*
      # typescript와 @typescript-eslint/*는 서로를 기다리므로 한 PR에 묶어야 하고,
      # 동시에 나머지 dev 툴링과는 분리해야 한다. typescript-eslint가 TS 7을 아직
      # 지원하지 않아(`does not support TS 7.0` 하드 가드) 이 조합은 지원이 도착할
      # 때까지 CI가 빨갛게 남는데, 한 그룹에 있으면 무관한 업데이트까지 함께 막힌다.
      # 분리해두면 지원 도착 시 둘이 함께 올라가 통과하고, 그때까지 나머지는 흐른다.
      typescript-toolchain:
        patterns:
          - typescript
          - '@typescript-eslint/*'
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - typescript
          - '@typescript-eslint/*'
    commit-message:
      prefix: chore
